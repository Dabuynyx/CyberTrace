[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cybertrace"
version = "0.1.1"
description = "Modular digital forensics and investigation framework"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    {name = "CyberTrace Contributors"}
]
keywords = [
    "forensics",
    "digital-forensics",
    "dfir",
    "incident-response",
    "malware-analysis",
    "security",
    "investigation"
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "jinja2>=3.1.3",
    "pillow>=10.2.0",
    "pefile>=2023.2.7",
    "pyelftools>=0.30",
    "python-multipart>=0.0.9",
    "reportlab>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
cybertrace = "cybertrace.cli.main:app"

[tool.setuptools.packages.find]
include = ["cybertrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
