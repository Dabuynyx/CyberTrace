name: Bug report
description: Create a report to help us improve CyberTrace
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: command-or-code
    attributes:
      label: Relevant CyberTrace command or code executed
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Python version, ExifTool/YARA version.
    validations:
      required: true
